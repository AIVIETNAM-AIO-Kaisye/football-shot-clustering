[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-shot-clustering"
version = "0.1.0"
description = "Phân cụm chất lượng vùng sút từ StatsBomb open-data (K-Means + KNN validation)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

# Cài đặt ở chế độ editable để `from shotquality import ...` chạy được mọi nơi:
#     pip install -e .
# Nhờ vậy không ai phải chèn sys.path trong notebook.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
